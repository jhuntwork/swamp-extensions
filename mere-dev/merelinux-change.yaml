id: 7af6c0f1-43d8-4ef4-9f0a-cc1a8fd78b24
name: "@jeremy/merelinux-change"
description: >-
  Proposal-led delivery workflow for a MereLinux recipe change. It creates an
  isolated clone from main, suspends for scoped implementation and review,
  validates and builds one recipe, imports its outputs into a dedicated local
  repository, installs the requested package set into an isolated profile for
  an exact-argv smoke test, then hands the change to
  @jeremy/mere-delivery/deliver-change to check the commit, push it, and publish
  a review pull request.
version: 1
concurrency: 1
inputs:
  properties:
    worktreePath:
      type: string
      minLength: 1
      description: New, empty local path for this isolated clone.
    branch:
      type: string
      minLength: 1
      pattern: '^[^/\\]+$'
      description: Informal branch name; slash-separated names are unsupported by the installed Git adapter.
    baseSha:
      type: string
      minLength: 40
      maxLength: 64
      pattern: '^[0-9a-fA-F]{40,64}$'
      description: Immutable commit on main from which the branch is created.
    proposal:
      type: string
      minLength: 1
    acceptanceCriteria:
      type: array
      minItems: 1
      items:
        type: string
        minLength: 1
    allowedPaths:
      type: array
      minItems: 1
      items:
        type: string
      description: Exact repository-relative paths the workflow may commit.
    recipePath:
      type: string
      minLength: 1
      pattern: '^recipes/[^/]+/[^/]+/recipe\\.kdl$'
      description: Repository-relative recipe.kdl to validate and build.
    repository:
      type: string
      minLength: 1
      default: local
      description: Local development repository populated by the built outputs.
    packages:
      type: array
      minItems: 1
      items:
        type: string
        minLength: 1
      description: Exact package set installed in the isolated smoke profile.
    smokeArgv:
      type: array
      minItems: 1
      items:
        type: string
        minLength: 1
      description: Exact argv executed in the installed package profile; no shell interpretation is used.
    devModel:
      type: string
      minLength: 1
      default: merelinux-recipe-validation
      description: '@jeremy/mere-dev binding for validate, build, and import.'
    shellModel:
      type: string
      minLength: 1
      default: merelinux-recipe-smoke
      description: '@jeremy/mere-shell binding sharing the dev model Mere root.'
    commitMessage:
      type: string
      minLength: 1
    title:
      type: string
      minLength: 1
      maxLength: 256
    body:
      type: string
      maxLength: 65535
      default: ""
    prModel:
      type: string
      minLength: 1
      default: merelinux-pr
    draft:
      type: boolean
      default: false
    issue:
      type: integer
      minimum: 0
      default: 0
      description: Associated issue number, or 0 for none. When set, the pull request body must reference it.
  required:
    - worktreePath
    - branch
    - baseSha
    - proposal
    - acceptanceCriteria
    - allowedPaths
    - recipePath
    - packages
    - smokeArgv
    - commitMessage
    - title
jobs:
  - name: prepare
    description: Create a clean MereLinux clone and branch from the explicit immutable base.
    steps:
      - name: assert-compatible-branch
        task:
          type: assert
          expr: >-
            !inputs.branch.contains("/") && !inputs.branch.contains("\\\\")
          message: Slash- or backslash-containing branch names are unsupported by the installed Git adapter.
          severity: high
      - name: assert-recipe-is-scoped
        dependsOn:
          - step: assert-compatible-branch
            condition:
              type: succeeded
        task:
          type: assert
          expr: inputs.allowedPaths.exists(path, path == inputs.recipePath)
          message: The recipe selected for validation must be included in allowedPaths.
          severity: high
      - name: clone-main
        dependsOn:
          - step: assert-recipe-is-scoped
            condition:
              type: succeeded
        task:
          type: model_method
          modelType: "@swamp/git"
          modelName: ${{ "merelinux-clone-" + run.id }}
          methodName: clone
          inputs:
            url: git@github.com:jhuntwork/merelinux.git
            path: ${{ inputs.worktreePath }}
            branch: main
            depth: 0
      - name: create-branch
        dependsOn:
          - step: clone-main
            condition:
              type: succeeded
        task:
          type: model_method
          modelType: "@swamp/git"
          modelName: ${{ "merelinux-worktree-" + run.id }}
          methodName: branch
          inputs:
            repoPath: ${{ inputs.worktreePath }}
            name: ${{ inputs.branch }}
            create: true
            startPoint: ${{ inputs.baseSha }}
        dataOutputOverrides:
          - specName: branchResult
            lifetime: workflow
      - name: assert-branch-recorded
        dependsOn:
          - step: create-branch
            condition:
              type: succeeded
        task:
          type: assert
          expr: >-
            data.findBySpec("merelinux-worktree-" + run.id, "branchResult")[0].attributes.current == inputs.branch
          message: Branch creation did not produce workflow-lifetime Git evidence for the requested branch.
          severity: high
  - name: implementation-review
    description: Suspend after preparation for scoped recipe implementation and diff review.
    dependsOn:
      - job: prepare
        condition:
          type: succeeded
    steps:
      - name: approve-implementation
        task:
          type: manual_approval
          prompt: >-
            Implement only the accepted MereLinux recipe proposal in this run's
            isolated checkout, review the complete diff against the immutable
            base, and confirm every changed path is allowed. Approval resumes
            fixed recipe validation and review-branch delivery.
  - name: validate-and-deliver
    description: Validate the recipe through an installed package smoke test, then deliver it for PR review.
    dependsOn:
      - job: implementation-review
        condition:
          type: succeeded
    steps:
      - name: validate-recipe
        task:
          type: model_method
          modelIdOrName: ${{ inputs.devModel }}
          methodName: validate
          inputs:
            recipe: ${{ inputs.worktreePath + "/" + inputs.recipePath }}
      - name: build-recipe
        dependsOn:
          - step: validate-recipe
            condition:
              type: succeeded
        task:
          type: model_method
          modelIdOrName: ${{ inputs.devModel }}
          methodName: build
          inputs:
            recipe: ${{ inputs.worktreePath + "/" + inputs.recipePath }}
      - name: import-outputs
        dependsOn:
          - step: build-recipe
            condition:
              type: succeeded
        task:
          type: model_method
          modelIdOrName: ${{ inputs.devModel }}
          methodName: importOutputs
          inputs:
            repository: ${{ inputs.repository }}
      - name: smoke-installed-packages
        dependsOn:
          - step: import-outputs
            condition:
              type: succeeded
        task:
          type: model_method
          modelIdOrName: ${{ inputs.shellModel }}
          methodName: run
          inputs:
            packages: ${{ inputs.packages }}
            argv: ${{ inputs.smokeArgv }}
            workdir: /
      - name: assert-smoke-succeeded
        dependsOn:
          - step: smoke-installed-packages
            condition:
              type: succeeded
        task:
          type: assert
          expr: >-
            data.query('modelName == "' + inputs.shellModel + '" && specName == "result" && tags.workflowRunId == "' + run.id + '"')[0].attributes.success == true &&
            data.query('modelName == "' + inputs.shellModel + '" && specName == "result" && tags.workflowRunId == "' + run.id + '"')[0].attributes.exitCode == 0 &&
            data.query('modelName == "' + inputs.shellModel + '" && specName == "result" && tags.workflowRunId == "' + run.id + '"')[0].attributes.packages == inputs.packages &&
            data.query('modelName == "' + inputs.shellModel + '" && specName == "result" && tags.workflowRunId == "' + run.id + '"')[0].attributes.argv == inputs.smokeArgv &&
            data.query('modelName == "' + inputs.shellModel + '" && specName == "result" && tags.workflowRunId == "' + run.id + '"')[0].attributes.mereRoot == data.query('modelName == "' + inputs.devModel + '" && specName == "validation-result" && tags.workflowRunId == "' + run.id + '"')[0].attributes.mereRoot &&
            data.query('modelName == "' + inputs.shellModel + '" && specName == "result" && tags.workflowRunId == "' + run.id + '"')[0].attributes.mereVersion == data.query('modelName == "' + inputs.devModel + '" && specName == "validation-result" && tags.workflowRunId == "' + run.id + '"')[0].attributes.mereVersion
          message: The smoke command failed, or the validation and smoke bindings did not use the same isolated Mere root and version.
          severity: high
      - name: inspect-candidate-status
        dependsOn:
          - step: assert-smoke-succeeded
            condition:
              type: succeeded
        task:
          type: model_method
          modelType: "@swamp/git"
          modelName: ${{ "merelinux-worktree-" + run.id }}
          methodName: status
          inputs:
            repoPath: ${{ inputs.worktreePath }}
        dataOutputOverrides:
          - specName: statusResult
            lifetime: workflow
      - name: deliver-change
        dependsOn:
          - step: inspect-candidate-status
            condition:
              type: succeeded
        task:
          type: workflow
          workflowIdOrName: "@jeremy/mere-delivery/deliver-change"
          inputs:
            worktreePath: ${{ inputs.worktreePath }}
            branch: ${{ inputs.branch }}
            baseSha: ${{ inputs.baseSha }}
            allowedPaths: ${{ inputs.allowedPaths }}
            commitMessage: ${{ inputs.commitMessage }}
            title: ${{ inputs.title }}
            body: ${{ inputs.body }}
            profile: merelinux
            repository: jhuntwork/merelinux
            prBinding: ${{ inputs.prModel }}
            draft: ${{ inputs.draft }}
            issue: ${{ inputs.issue }}
            checkName: recipe-validation
            checkDetail: The recipe validated, built, imported, installed, and passed its exact-argv smoke check.
