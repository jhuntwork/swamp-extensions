manifestVersion: 1
name: "@jeremy/github-draft-pr"
version: "2026.08.18.1"
description: >
  Narrow GitHub.com same-repository draft pull-request boundary: preflight,
  plan, apply, and read-back verification. No merge, release, repository
  administration, PR update, or arbitrary endpoint capability.
repository: "https://github.com/jhuntwork/swamp-extensions"
paths:
  base: manifest
models:
  - mod.ts
workflows: []
vaults: []
drivers: []
datastores: []
reports: []
additionalFiles:
  - README.md
  - DESIGN.md
  - preflight.ts
  - packet.ts
  - plan.ts
  - apply.ts
  - verify.ts
  - preflight_test.ts
  - packet_test.ts
  - plan_test.ts
  - apply_test.ts
  - verify_test.ts
  - mod_test.ts
  - LICENSE.txt
labels:
  - github
  - pull-request
  - draft
  - workflow
  - review
dependencies: []
