id: 42362d1b-e560-4a49-85dc-11240bcddad7
autoResume: true
name: "@jeremy/mere-delivery/deliver-change"
description: >-
  Commit a worktree's change, check the message against the repository's
  commit profile, push its branch, check the pushed diff is only what was
  expected, then plan, create and read back the pull request through
  @jeremy/github-pr. Never merges: the merge is manual.
tags: {}
inputs:
  properties:
    worktreePath:
      type: string
    branch:
      type: string
    baseSha:
      type: string
      description: Full commit the branch was cut from
    allowedPaths:
      type: array
      items:
        type: string
      description: The only paths the change may touch
    commitMessage:
      type: string
    title:
      type: string
    body:
      type: string
    profile:
      type: string
      enum:
        - mere
        - merelinux
      description: Which repository's commit and branch standards apply (see profiles.ts).
    repository:
      type: string
      description: Target repository as owner/name, for example jhuntwork/mere.
    baseRef:
      type: string
      default: main
    prBinding:
      type: string
      description: "@jeremy/github-pr behavior bound to the repository"
    expectedAuthorEmail:
      type: string
      default: ""
      description: When set, the commit's author must have this email
    draft:
      type: boolean
      default: false
      description: Request a draft pull request when true.
    issue:
      type: integer
      minimum: 0
      default: 0
      description: Associated issue number, or 0 for none. When set, the pull request body must reference it.
    checkName:
      type: string
      description: Name of the validation evidence recorded with the change.
    checkDetail:
      type: string
      description: One line saying what that validation covered.
  required:
    - worktreePath
    - branch
    - baseSha
    - allowedPaths
    - commitMessage
    - title
    - body
    - profile
    - repository
    - prBinding
    - checkName
    - checkDetail
jobs:
  - name: prepare
    steps:
      - name: check-message
        description: The commit message, PR title and branch meet the standards
        task:
          type: model_method
          modelType: "@jeremy/mere-delivery"
          modelName: ${{ "mere-delivery-policy-" + run.id }}
          methodName: checkCommit
          inputs:
            message: ${{ inputs.commitMessage }}
            title: ${{ inputs.title }}
            branch: ${{ inputs.branch }}
            profile: ${{ inputs.profile }}
            prBody: ${{ inputs.body }}
            issue: ${{ inputs.issue }}
        dependsOn: []
        weight: 0
        allowFailure: false
      - name: check-description
        description: The pull request body meets the description policy, checked before anything is committed or pushed
        task:
          type: behavior
          behavior: ${{ inputs.prBinding }}
          methodName: checkDescription
          inputs:
            body: ${{ inputs.body }}
            style: ${{ data.query('modelName == "mere-delivery-policy-' + run.id + '" && specName == "commitCheck" && tags.workflowRunId == "' + run.id + '"')[0].attributes.descriptionStyle }}
        dependsOn:
          - step: check-message
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: status
        description: Whether the allowed paths still have uncommitted changes; a branch that already has its commit does not
        task:
          type: model_method
          modelType: "@swamp/git"
          modelName: ${{ "mere-deliver-" + run.id }}
          methodName: status
          inputs:
            repoPath: ${{ inputs.worktreePath }}
            paths: ${{ inputs.allowedPaths }}
        dataOutputOverrides:
          - specName: statusResult
            lifetime: workflow
        dependsOn:
          - step: check-description
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: commit
        description: Commit only the allowed paths; skipped when they are already committed, so a resumed run does not fail on an empty commit
        guard: ${{ data.query('modelName == "mere-deliver-' + run.id + '" && specName == "statusResult" && tags.workflowRunId == "' + run.id + '"')[0].attributes.clean }}
        task:
          type: model_method
          modelType: "@swamp/git"
          modelName: ${{ "mere-deliver-" + run.id }}
          methodName: commit
          inputs:
            repoPath: ${{ inputs.worktreePath }}
            message: ${{ inputs.commitMessage }}
            paths: ${{ inputs.allowedPaths }}
            addAll: false
        dataOutputOverrides:
          - specName: commitResult
            lifetime: workflow
        dependsOn:
          - step: status
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: head
        description: The commit at the tip of the branch, whether this run made it or an earlier one did
        task:
          type: model_method
          modelType: "@swamp/git"
          modelName: ${{ "mere-deliver-head-" + run.id }}
          methodName: log
          inputs:
            repoPath: ${{ inputs.worktreePath }}
            maxCount: 1
        dataOutputOverrides:
          - specName: logResult
            lifetime: workflow
        dependsOn:
          - step: commit
            condition:
              type: or
              conditions:
                - type: succeeded
                - type: skipped
        weight: 0
        allowFailure: false
      - name: read-commit
        description: Read back the commit that was actually made
        task:
          type: model_method
          modelType: "@swamp/git"
          modelName: ${{ "mere-deliver-" + run.id }}
          methodName: log
          inputs:
            repoPath: ${{ inputs.worktreePath }}
            maxCount: 1
            format: "%an <%ae>%n%B"
        dataOutputOverrides:
          - specName: logResult
            lifetime: workflow
        dependsOn:
          - step: head
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: verify-commit
        description: The real commit has the expected subject, no body or trailers, and the expected author
        task:
          type: model_method
          modelType: "@jeremy/mere-delivery"
          modelName: ${{ "mere-delivery-policy-" + run.id }}
          methodName: checkCommit
          inputs:
            rawCommit: >-
              ${{ data.query('modelName == "mere-deliver-' + run.id + '" && specName == "logResult" && tags.workflowRunId == "' + run.id + '"')[0].attributes.raw }}
            expectedSubject: ${{ inputs.commitMessage.split("\n")[0] }}
            expectedAuthorEmail: ${{ inputs.expectedAuthorEmail }}
            profile: ${{ inputs.profile }}
        dependsOn:
          - step: read-commit
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: diff
        description: List what the branch changes against its base, before anything is pushed
        task:
          type: model_method
          modelType: "@swamp/git"
          modelName: ${{ "mere-deliver-" + run.id }}
          methodName: diff
          inputs:
            repoPath: ${{ inputs.worktreePath }}
            base: ${{ inputs.baseSha }}
            head: HEAD
            nameOnly: true
            threeWay: true
        dataOutputOverrides:
          - specName: diffResult
            lifetime: workflow
        dependsOn:
          - step: verify-commit
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: assert-scoped
        description: The diff is not empty and has only allowed paths, so nothing out of scope is ever pushed
        task:
          type: assert
          expr: >-
            data.query('modelName == "mere-deliver-' + run.id + '" && specName == "diffResult" && tags.workflowRunId == "' + run.id + '"')[0].attributes.files.size() > 0 &&
            data.query('modelName == "mere-deliver-' + run.id + '" && specName == "diffResult" && tags.workflowRunId == "' + run.id + '"')[0].attributes.files.all(path, inputs.allowedPaths.exists(allowed, allowed == path))
          message: The pushed diff is empty or contains a path outside the expected change.
          severity: high
        dependsOn:
          - step: diff
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
    dependsOn: []
    weight: 0
  - name: publish
    steps:
      - name: push
        description: Push the branch; never forced
        task:
          type: model_method
          modelType: "@swamp/git"
          modelName: ${{ "mere-deliver-" + run.id }}
          methodName: push
          inputs:
            repoPath: ${{ inputs.worktreePath }}
            remote: origin
            branch: ${{ inputs.branch }}
            setUpstream: true
            force: false
        dependsOn: []
        weight: 0
        allowFailure: false
      - name: plan-pr
        task:
          type: behavior
          behavior: ${{ inputs.prBinding }}
          methodName: planPr
          inputs:
            change:
              schemaVersion: 1
              targetRepository: ${{ inputs.repository }}
              sourceRepository: ${{ inputs.repository }}
              base:
                ref: ${{ inputs.baseRef }}
                sha: ${{ inputs.baseSha }}
              head:
                ref: ${{ inputs.branch }}
                sha: ${{ data.query('modelName == "mere-deliver-head-' + run.id + '" && specName == "logResult" && tags.workflowRunId == "' + run.id + '"')[0].attributes.commits[0].sha }}
              changedPaths: ${{ data.query('modelName == "mere-deliver-' + run.id + '" && specName == "diffResult" && tags.workflowRunId == "' + run.id + '"')[0].attributes.files }}
              checks:
                - name: ${{ inputs.checkName }}
                  required: true
                  outcome: passed
                  evidenceRef: ${{ "swamp://local/workflow/" + run.id }}
                  detail: ${{ inputs.checkDetail }}
              submission:
                title: ${{ inputs.title }}
                body: ${{ inputs.body }}
                draft: ${{ inputs.draft }}
                descriptionStyle: ${{ data.query('modelName == "mere-delivery-policy-' + run.id + '" && specName == "commitCheck" && tags.workflowRunId == "' + run.id + '"')[0].attributes.descriptionStyle }}
        dependsOn:
          - step: push
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: apply-pr
        task:
          type: behavior
          behavior: ${{ inputs.prBinding }}
          methodName: applyPr
          inputs:
            change:
              schemaVersion: 1
              targetRepository: ${{ inputs.repository }}
              sourceRepository: ${{ inputs.repository }}
              base:
                ref: ${{ inputs.baseRef }}
                sha: ${{ inputs.baseSha }}
              head:
                ref: ${{ inputs.branch }}
                sha: ${{ data.query('modelName == "mere-deliver-head-' + run.id + '" && specName == "logResult" && tags.workflowRunId == "' + run.id + '"')[0].attributes.commits[0].sha }}
              changedPaths: ${{ data.query('modelName == "mere-deliver-' + run.id + '" && specName == "diffResult" && tags.workflowRunId == "' + run.id + '"')[0].attributes.files }}
              checks:
                - name: ${{ inputs.checkName }}
                  required: true
                  outcome: passed
                  evidenceRef: ${{ "swamp://local/workflow/" + run.id }}
                  detail: ${{ inputs.checkDetail }}
              submission:
                title: ${{ inputs.title }}
                body: ${{ inputs.body }}
                draft: ${{ inputs.draft }}
                descriptionStyle: ${{ data.query('modelName == "mere-delivery-policy-' + run.id + '" && specName == "commitCheck" && tags.workflowRunId == "' + run.id + '"')[0].attributes.descriptionStyle }}
            plan: >-
              ${{ data.query('modelName == "' + inputs.prBinding + '" && specName == "plan" && tags.workflowRunId == "' + run.id + '"')[0].attributes }}
        dependsOn:
          - step: plan-pr
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: verify-pr
        task:
          type: behavior
          behavior: ${{ inputs.prBinding }}
          methodName: verifyPr
          inputs:
            change:
              schemaVersion: 1
              targetRepository: ${{ inputs.repository }}
              sourceRepository: ${{ inputs.repository }}
              base:
                ref: ${{ inputs.baseRef }}
                sha: ${{ inputs.baseSha }}
              head:
                ref: ${{ inputs.branch }}
                sha: ${{ data.query('modelName == "mere-deliver-head-' + run.id + '" && specName == "logResult" && tags.workflowRunId == "' + run.id + '"')[0].attributes.commits[0].sha }}
              changedPaths: ${{ data.query('modelName == "mere-deliver-' + run.id + '" && specName == "diffResult" && tags.workflowRunId == "' + run.id + '"')[0].attributes.files }}
              checks:
                - name: ${{ inputs.checkName }}
                  required: true
                  outcome: passed
                  evidenceRef: ${{ "swamp://local/workflow/" + run.id }}
                  detail: ${{ inputs.checkDetail }}
              submission:
                title: ${{ inputs.title }}
                body: ${{ inputs.body }}
                draft: ${{ inputs.draft }}
                descriptionStyle: ${{ data.query('modelName == "mere-delivery-policy-' + run.id + '" && specName == "commitCheck" && tags.workflowRunId == "' + run.id + '"')[0].attributes.descriptionStyle }}
            result: >-
              ${{ data.query('modelName == "' + inputs.prBinding + '" && specName == "applied" && tags.workflowRunId == "' + run.id + '"')[0].attributes }}
        dependsOn:
          - step: apply-pr
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
    dependsOn:
      - job: prepare
        condition:
          type: succeeded
    weight: 0
version: 1
