manifestVersion: 1
name: "@jeremy/mere-delivery"
version: "2026.11.18.1"
description: >-
  Commit and branch standards for Mere repositories, held as named profiles,
  plus the one workflow that derives an exact-match pull-request body from the
  commit message, applies explicit issue references or closing keywords, commits
  only the allowed paths, pushes without force, and opens and verifies a pull
  request through @jeremy/github-pr.
repository: "https://github.com/jhuntwork/swamp-extensions"
license: MIT
paths:
  base: manifest
models:
  - mod.ts
workflows:
  - deliver-change.yaml
vaults: []
drivers: []
datastores: []
reports: []
additionalFiles:
  - README.md
  - LICENSE.txt
  - mod_test.ts
  - commit_policy_test.ts
labels:
  - mere
  - commit-policy
  - delivery
  - pull-request
dependencies:
  - "@jeremy/github-pr"
  - "@swamp/git"
