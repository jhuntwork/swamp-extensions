manifestVersion: 1
name: "@jeremy/change-packet"
version: "2026.11.10.1"
description: >
  Forge-neutral immutable change packets for reviewed repository delivery.
  Records exact Git base/head identity, validation evidence, requested draft
  submission metadata, a canonical SHA-256 digest, and derived readiness.
  Performs no network, Git, forge, approval, merge, or release operation.
