manifestVersion: 1
name: "@jeremy/github-pr"
version: "2026.11.15.3"
description: >
  Narrow GitHub.com same-repository pull-request boundary: preflight, plan,
  apply, and read-back verification. It leaves rationale and Markdown formatting
  to the caller and computes change integrity and readiness internally. No
  merge, release, repository administration, PR update, or arbitrary endpoint
  capability.
repository: "https://github.com/jhuntwork/swamp-extensions"
license: MIT
paths:
  base: manifest
models:
  - mod.ts
workflows: []
vaults: []
drivers: []
datastores: []
reports: []
additionalFiles:
  - README.md
  - DESIGN.md
  - auth_test.ts
  - gh_test.ts
  - preflight_test.ts
  - packet_test.ts
  - description_policy_test.ts
  - plan_test.ts
  - apply_test.ts
  - verify_test.ts
  - mod_test.ts
  - test_packet.ts
  - LICENSE.txt
labels:
  - github
  - pull-request
  - workflow
  - review
dependencies: []
