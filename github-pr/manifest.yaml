manifestVersion: 1
name: "@jeremy/github-pr"
version: "2026.11.08.1"
description: >
  Narrow GitHub.com same-repository pull-request boundary: preflight, plan,
  apply, and read-back verification. Draft is requested per change rather than
  fixed by the adapter. It accepts slim change facts and computes the integrity
  digest and readiness internally; legacy packets remain readable during
  migration. No merge, release, repository administration, PR update, or
  arbitrary endpoint capability.
repository: "https://github.com/jhuntwork/swamp-extensions"
license: MIT
paths:
  base: manifest
models:
  - mod.ts
workflows: []
vaults: []
drivers: []
datastores: []
reports: []
additionalFiles:
  - README.md
  - DESIGN.md
  - auth.ts
  - preflight.ts
  - packet.ts
  - plan.ts
  - apply.ts
  - verify.ts
  - auth_test.ts
  - gh_test.ts
  - preflight_test.ts
  - packet_test.ts
  - plan_test.ts
  - apply_test.ts
  - verify_test.ts
  - mod_test.ts
  - LICENSE.txt
labels:
  - github
  - pull-request
  - workflow
  - review
dependencies: []
