manifestVersion: 1
name: "@jeremy/mere-pm-dev"
version: "2026.08.21.2"
description: >
  Build and validate the Mere package-manager source tree through fixed,
  cancellable Zig commands, and package its fresh-branch delivery workflows.
  Does not download Mere releases, manage a Mere root, build recipes, publish
  artifacts, or provide credentials.
repository: "https://github.com/jhuntwork/swamp-extensions"
paths:
  base: manifest
models:
  - mod.ts
workflows:
  - mere-change-prepare.yaml
  - mere-change.yaml
vaults: []
drivers: []
datastores: []
reports: []
additionalFiles:
  - README.md
  - LICENSE.txt
  - mod_test.ts
labels:
  - mere
  - package-manager
  - development
  - zig
  - validation
  - delivery
  - pull-request
dependencies:
  - "@jeremy/change-packet"
  - "@jeremy/github-pr"
