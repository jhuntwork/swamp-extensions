manifestVersion: 1
name: "@jeremy/mere-pm-dev"
version: "2026.11.13.4"
description: >
  Build and validate the Mere package-manager source tree through fixed Zig
  commands run inside a @jeremy/mere-shell namespace, so no host Zig is needed,
  and package its fresh-branch delivery workflows. Does not build recipes,
  publish artifacts, or provide credentials.
repository: "https://github.com/jhuntwork/swamp-extensions"
license: MIT
paths:
  base: manifest
models:
  - mod.ts
workflows:
  - mere-change-prepare.yaml
  - mere-change.yaml
vaults: []
drivers: []
datastores: []
reports: []
additionalFiles:
  - README.md
  - LICENSE.txt
  - mod_test.ts
labels:
  - mere
  - package-manager
  - development
  - zig
  - validation
  - delivery
  - pull-request
dependencies:
  - "@jeremy/mere-shell"
  - "@jeremy/mere-delivery"
  - "@jeremy/github-pr"
