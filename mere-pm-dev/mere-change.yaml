id: 14f8837e-5232-4b25-8d13-5560c8a413f0
name: "@jeremy/mere-change"
description: >-
  Deliver one scoped implementation-ready change from an existing isolated
  Mere candidate: validate with the supplied Mere source model, commit and push
  the allowed paths, create and verify a change packet, then create and verify
  the planned pull request. Prepare the candidate first with
  @jeremy/mere-change-prepare. This workflow contains no credentials or model
  bindings.
version: 1
concurrency: 1
inputs:
  properties:
    worktreePath:
      type: string
      minLength: 1
      description: Existing isolated Mere candidate prepared at baseSha and containing the scoped implementation.
    branch:
      type: string
      minLength: 1
      pattern: '^[^/\\]+$'
      description: Informal non-hierarchical branch name.
    baseSha:
      type: string
      pattern: '^[0-9a-fA-F]{40,64}$'
      description: Immutable main commit used as branch start and packet base.
    proposal:
      type: string
      minLength: 1
      description: Agreed user-visible change.
    acceptanceCriteria:
      type: array
      minItems: 1
      items:
        type: string
        minLength: 1
      description: Observable completion conditions.
    allowedPaths:
      type: array
      minItems: 1
      items:
        type: string
      description: Exact paths staged for the scoped commit.
    commitMessage:
      type: string
      minLength: 1
      description: Natural-English declaration of intent for the scoped commit.
    title:
      type: string
      minLength: 1
      maxLength: 256
      description: Pull-request title.
    body:
      type: string
      default: ""
      maxLength: 65535
      description: Pull-request body.
    prModel:
      type: string
      minLength: 1
      description: Local vault-backed @jeremy/github-pr model binding.
    draft:
      type: boolean
      default: false
      description: Request a draft pull request when true.
  required:
    - worktreePath
    - branch
    - baseSha
    - proposal
    - acceptanceCriteria
    - allowedPaths
    - commitMessage
    - title
    - prModel
jobs:
  - name: validate-and-deliver
    steps:
      - name: assert-branch
        task:
          type: assert
          expr: >-
            !inputs.branch.contains("/") && !inputs.branch.contains("\\\\")
          message: Branch names cannot contain slash or backslash.
          severity: high
      - name: inspect-candidate-branch
        dependsOn:
          - step: assert-branch
            condition:
              type: succeeded
        task:
          type: model_method
          modelType: "@swamp/git"
          modelName: ${{ "mere-worktree-" + run.id }}
          methodName: branch
          inputs:
            repoPath: ${{ inputs.worktreePath }}
            list: true
      - name: assert-candidate-branch
        dependsOn:
          - step: inspect-candidate-branch
            condition:
              type: succeeded
        task:
          type: assert
          expr: >-
            data.latest("mere-worktree-" + run.id, "branchResult").current == inputs.branch
          message: Candidate worktree is not on the requested delivery branch.
          severity: high
      - name: test
        dependsOn:
          - step: assert-candidate-branch
            condition:
              type: succeeded
        task:
          type: model_method
          modelType: "@jeremy/mere-pm-dev"
          modelName: ${{ "mere-pm-" + run.id }}
          methodName: test
          inputs:
            sourcePath: ${{ inputs.worktreePath }}
      - name: assert-test
        dependsOn:
          - step: test
            condition:
              type: succeeded
        task:
          type: assert
          expr: >-
            data.latest("mere-pm-" + run.id, "current").success == true &&
            data.latest("mere-pm-" + run.id, "current").exitCode == 0
          message: Full Mere source validation failed.
          severity: high
      - name: portable-build
        dependsOn:
          - step: assert-test
            condition:
              type: succeeded
        task:
          type: model_method
          modelType: "@jeremy/mere-pm-dev"
          modelName: ${{ "mere-pm-" + run.id }}
          methodName: releaseBuild
          inputs:
            sourcePath: ${{ inputs.worktreePath }}
      - name: assert-portable-build
        dependsOn:
          - step: portable-build
            condition:
              type: succeeded
        task:
          type: assert
          expr: >-
            data.latest("mere-pm-" + run.id, "current").success == true &&
            data.latest("mere-pm-" + run.id, "current").exitCode == 0 &&
            data.latest("mere-pm-" + run.id, "current").baseline == true
          message: Portable baseline build failed.
          severity: high
      - name: smoke
        dependsOn:
          - step: assert-portable-build
            condition:
              type: succeeded
        task:
          type: model_method
          modelType: "@jeremy/mere-pm-dev"
          modelName: ${{ "mere-pm-" + run.id }}
          methodName: smoke
          inputs:
            sourcePath: ${{ inputs.worktreePath }}
      - name: assert-smoke
        dependsOn:
          - step: smoke
            condition:
              type: succeeded
        task:
          type: assert
          expr: >-
            data.latest("mere-pm-" + run.id, "current").success == true &&
            data.latest("mere-pm-" + run.id, "current").exitCode == 0 &&
            data.latest("mere-pm-" + run.id, "current").stderr == ""
          message: Built Mere CLI smoke failed.
          severity: high
      - name: commit
        dependsOn:
          - step: assert-smoke
            condition:
              type: succeeded
        task:
          type: model_method
          modelType: "@swamp/git"
          modelName: ${{ "mere-worktree-" + run.id }}
          methodName: commit
          inputs:
            repoPath: ${{ inputs.worktreePath }}
            message: ${{ inputs.commitMessage }}
            paths: ${{ inputs.allowedPaths }}
            addAll: false
        dataOutputOverrides:
          - specName: commitResult
            lifetime: workflow
      - name: push
        dependsOn:
          - step: commit
            condition:
              type: succeeded
        task:
          type: model_method
          modelType: "@swamp/git"
          modelName: ${{ "mere-worktree-" + run.id }}
          methodName: push
          inputs:
            repoPath: ${{ inputs.worktreePath }}
            remote: origin
            branch: ${{ inputs.branch }}
            setUpstream: true
            force: false
      - name: changed-paths
        dependsOn:
          - step: push
            condition:
              type: succeeded
        task:
          type: model_method
          modelType: "@swamp/git"
          modelName: ${{ "mere-worktree-" + run.id }}
          methodName: diff
          inputs:
            repoPath: ${{ inputs.worktreePath }}
            base: ${{ inputs.baseSha }}
            head: HEAD
            nameOnly: true
            threeWay: true
        dataOutputOverrides:
          - specName: diffResult
            lifetime: workflow
      - name: packet
        dependsOn:
          - step: changed-paths
            condition:
              type: succeeded
        task:
          type: model_method
          modelType: "@jeremy/change-packet"
          modelName: ${{ "mere-packet-" + run.id }}
          methodName: create
          inputs:
            targetRepository: jhuntwork/mere
            sourceRepository: jhuntwork/mere
            base:
              ref: main
              sha: ${{ inputs.baseSha }}
            head:
              ref: ${{ inputs.branch }}
              sha: ${{ data.findBySpec("mere-worktree-" + run.id, "commitResult")[0].sha }}
            changedPaths: ${{ data.findBySpec("mere-worktree-" + run.id, "diffResult")[0].files }}
            checks:
              - name: repository-validation
                required: true
                outcome: passed
                evidenceRef: ${{ "swamp://local/workflow/" + run.id + "/test" }}
                detail: Full tests, portable build, and built CLI smoke succeeded.
            submission:
              title: ${{ inputs.title }}
              body: ${{ inputs.body }}
              draft: ${{ inputs.draft }}
        dataOutputOverrides:
          - specName: packet
            lifetime: workflow
      - name: verify-packet
        dependsOn:
          - step: packet
            condition:
              type: succeeded
        task:
          type: model_method
          modelType: "@jeremy/change-packet"
          modelName: ${{ "mere-packet-" + run.id }}
          methodName: verify
          inputs:
            packet: >-
              ${{ data.query('modelName == "mere-packet-' + run.id + '" && specName == "packet" && tags.workflowRunId == "' + run.id + '"')[0] }}
      - name: assert-packet
        dependsOn:
          - step: verify-packet
            condition:
              type: succeeded
        task:
          type: assert
          expr: >-
            data.query('modelName == "mere-packet-' + run.id + '" && specName == "verification" && tags.workflowRunId == "' + run.id + '"')[0].valid == true &&
            data.query('modelName == "mere-packet-' + run.id + '" && specName == "verification" && tags.workflowRunId == "' + run.id + '"')[0].readiness.ready == true
          message: Delivery packet failed integrity or readiness verification.
          severity: high
      - name: plan-pr
        dependsOn:
          - step: assert-packet
            condition:
              type: succeeded
        task:
          type: model_method
          modelIdOrName: ${{ inputs.prModel }}
          methodName: planPr
          inputs:
            packet: >-
              ${{ data.query('modelName == "mere-packet-' + run.id + '" && specName == "packet" && tags.workflowRunId == "' + run.id + '"')[0] }}
      - name: apply-pr
        dependsOn:
          - step: plan-pr
            condition:
              type: succeeded
        task:
          type: model_method
          modelIdOrName: ${{ inputs.prModel }}
          methodName: applyPr
          inputs:
            packet: >-
              ${{ data.query('modelName == "mere-packet-' + run.id + '" && specName == "packet" && tags.workflowRunId == "' + run.id + '"')[0] }}
            plan: ${{ data.findBySpec(inputs.prModel, "plan")[0] }}
      - name: verify-pr
        dependsOn:
          - step: apply-pr
            condition:
              type: succeeded
        task:
          type: model_method
          modelIdOrName: ${{ inputs.prModel }}
          methodName: verifyPr
          inputs:
            packet: >-
              ${{ data.query('modelName == "mere-packet-' + run.id + '" && specName == "packet" && tags.workflowRunId == "' + run.id + '"')[0] }}
            result: ${{ data.findBySpec(inputs.prModel, "applied")[0] }}
