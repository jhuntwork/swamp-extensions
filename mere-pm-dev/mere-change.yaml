id: 14f8837e-5232-4b25-8d13-5560c8a413f0
name: "@jeremy/mere-change"
description: >-
  Deliver one scoped implementation-ready change from an existing isolated
  Mere candidate: check formatting and validate with the supplied Mere source model, then hand the change to
  @jeremy/mere-delivery/deliver-change to check the commit message, commit and
  push the allowed paths, and create and verify the pull request. Prepare the candidate first with
  @jeremy/mere-change-prepare. This workflow contains no credentials or model
  bindings.
version: 1
concurrency: 1
inputs:
  properties:
    worktreePath:
      type: string
      minLength: 1
      description: Existing isolated Mere candidate prepared at baseSha and containing the scoped implementation.
    branch:
      type: string
      minLength: 1
      pattern: '^[^/\\]+$'
      description: Informal non-hierarchical branch name.
    baseSha:
      type: string
      pattern: '^[0-9a-fA-F]{40,64}$'
      description: Immutable main commit used as branch start and change base.
    proposal:
      type: string
      minLength: 1
      description: Agreed user-visible change.
    acceptanceCriteria:
      type: array
      minItems: 1
      items:
        type: string
        minLength: 1
      description: Observable completion conditions.
    allowedPaths:
      type: array
      minItems: 1
      items:
        type: string
      description: Exact paths staged for the scoped commit.
    commitMessage:
      type: string
      minLength: 1
      description: Natural-English declaration of intent for the scoped commit.
    title:
      type: string
      minLength: 1
      maxLength: 256
      description: Pull-request title.
    body:
      type: string
      default: ""
      maxLength: 65535
      description: Pull-request body.
    prModel:
      type: string
      minLength: 1
      description: Local vault-backed @jeremy/github-pr model binding.
    draft:
      type: boolean
      default: false
      description: Request a draft pull request when true.
    issue:
      type: integer
      minimum: 0
      default: 0
      description: Associated issue number, or 0 for none. When set, the pull request body must reference it.
  required:
    - worktreePath
    - branch
    - baseSha
    - proposal
    - acceptanceCriteria
    - allowedPaths
    - commitMessage
    - title
    - prModel
jobs:
  - name: validate-and-deliver
    steps:
      - name: assert-branch
        task:
          type: assert
          expr: >-
            !inputs.branch.contains("/") && !inputs.branch.contains("\\\\")
          message: Branch names cannot contain slash or backslash.
          severity: high
      - name: inspect-candidate-branch
        dependsOn:
          - step: assert-branch
            condition:
              type: succeeded
        task:
          type: model_method
          modelType: "@swamp/git"
          modelName: ${{ "mere-worktree-" + run.id }}
          methodName: branch
          inputs:
            repoPath: ${{ inputs.worktreePath }}
            list: true
      - name: assert-candidate-branch
        dependsOn:
          - step: inspect-candidate-branch
            condition:
              type: succeeded
        task:
          type: assert
          expr: >-
            data.findBySpec("mere-worktree-" + run.id, "branchResult")[0].attributes.current == inputs.branch
          message: Candidate worktree is not on the requested delivery branch.
          severity: high
      - name: fmt-check
        dependsOn:
          - step: assert-candidate-branch
            condition:
              type: succeeded
        task:
          type: model_method
          modelType: "@jeremy/mere-pm-dev"
          modelName: ${{ "mere-pm-" + run.id }}
          methodName: fmtCheck
          inputs:
            sourcePath: ${{ inputs.worktreePath }}
      - name: assert-fmt
        dependsOn:
          - step: fmt-check
            condition:
              type: succeeded
        task:
          type: assert
          expr: >-
            data.findBySpec("mere-pm-" + run.id, "fmt-result")[0].attributes.success == true &&
            data.findBySpec("mere-pm-" + run.id, "fmt-result")[0].attributes.exitCode == 0
          message: Mere source formatting check failed.
          severity: high
      - name: test
        dependsOn:
          - step: assert-fmt
            condition:
              type: succeeded
        task:
          type: model_method
          modelType: "@jeremy/mere-pm-dev"
          modelName: ${{ "mere-pm-" + run.id }}
          methodName: test
          inputs:
            sourcePath: ${{ inputs.worktreePath }}
      - name: assert-test
        dependsOn:
          - step: test
            condition:
              type: succeeded
        task:
          type: assert
          expr: >-
            data.findBySpec("mere-pm-" + run.id, "test-result")[0].attributes.success == true &&
            data.findBySpec("mere-pm-" + run.id, "test-result")[0].attributes.exitCode == 0
          message: Full Mere source validation failed.
          severity: high
      - name: portable-build
        dependsOn:
          - step: assert-test
            condition:
              type: succeeded
        task:
          type: model_method
          modelType: "@jeremy/mere-pm-dev"
          modelName: ${{ "mere-pm-" + run.id }}
          methodName: releaseBuild
          inputs:
            sourcePath: ${{ inputs.worktreePath }}
      - name: assert-portable-build
        dependsOn:
          - step: portable-build
            condition:
              type: succeeded
        task:
          type: assert
          expr: >-
            data.findBySpec("mere-pm-" + run.id, "baseline-build-result")[0].attributes.success == true &&
            data.findBySpec("mere-pm-" + run.id, "baseline-build-result")[0].attributes.exitCode == 0 &&
            data.findBySpec("mere-pm-" + run.id, "baseline-build-result")[0].attributes.baseline == true
          message: Portable baseline build failed.
          severity: high
      - name: smoke
        dependsOn:
          - step: assert-portable-build
            condition:
              type: succeeded
        task:
          type: model_method
          modelType: "@jeremy/mere-pm-dev"
          modelName: ${{ "mere-pm-" + run.id }}
          methodName: smoke
          inputs:
            sourcePath: ${{ inputs.worktreePath }}
      - name: assert-smoke
        dependsOn:
          - step: smoke
            condition:
              type: succeeded
        task:
          type: assert
          expr: >-
            data.findBySpec("mere-pm-" + run.id, "smoke-result")[0].attributes.success == true &&
            data.findBySpec("mere-pm-" + run.id, "smoke-result")[0].attributes.exitCode == 0 &&
            data.findBySpec("mere-pm-" + run.id, "smoke-result")[0].attributes.stderr == ""
          message: Built Mere CLI smoke failed.
          severity: high
      - name: deliver-change
        dependsOn:
          - step: assert-smoke
            condition:
              type: succeeded
        task:
          type: workflow
          workflowIdOrName: "@jeremy/mere-delivery/deliver-change"
          inputs:
            worktreePath: ${{ inputs.worktreePath }}
            branch: ${{ inputs.branch }}
            baseSha: ${{ inputs.baseSha }}
            allowedPaths: ${{ inputs.allowedPaths }}
            commitMessage: ${{ inputs.commitMessage }}
            title: ${{ inputs.title }}
            body: ${{ inputs.body }}
            profile: mere
            repository: jhuntwork/mere
            prBinding: ${{ inputs.prModel }}
            draft: ${{ inputs.draft }}
            issue: ${{ inputs.issue }}
            checkName: repository-validation
            checkDetail: Format check, full tests, portable build, and built CLI smoke succeeded.
