id: 674e3d4d-56fb-4496-af95-1f97a50b2f3a
autoResume: true
name: "@jeremy/mere/recipe-rebuild"
description: >-
  Increment one merelinux recipe's release, validate and rebuild it with mere,
  then hand the scoped change to deliver-change. The caller states why the
  rebuild is needed, and that reason is the pull-request body. No
  source-version lookup or model calls.
tags: {}
inputs:
  properties:
    recipe:
      type: string
      description: "<category>/<name>, for example core/zlib-ng"
    recipeBinding:
      type: string
      default: merelinux
    prBinding:
      type: string
      default: merelinux-pr
    noCache:
      type: boolean
      default: true
    reason:
      type: string
      minLength: 1
      maxLength: 1500
      description: >-
        Why this recipe needs a new build, as one short paragraph for the
        reviewer. It becomes the pull-request body. A release-only rebuild is
        not worth merging without an independent reason, so one is required.
    expectedAuthorEmail:
      type: string
      default: ""
      description: When set, the commit's author must have this email
  required:
    - recipe
    - reason
jobs:
  - name: prepare
    steps:
      - name: scan
        description: Update the checkout and parse the tree
        task:
          type: behavior
          behavior: ${{ inputs.recipeBinding }}
          methodName: scan
        dependsOn: []
        weight: 0
        allowFailure: false
    dependsOn: []
    weight: 0
  - name: build
    steps:
      - name: workspace
        description: Paths for this rebuild; the worktree is named by the branch
        task:
          type: behavior
          behavior: ${{ inputs.recipeBinding }}
          methodName: workspace
          inputs:
            key: ${{ "bump-" + inputs.recipe.split("/")[1] + "-rebuild" }}
        dependsOn: []
        weight: 0
        allowFailure: false
      - name: clean
        description: Remove a stale worktree and local branch from an earlier try
        task:
          type: behavior
          behavior: ${{ inputs.recipeBinding }}
          methodName: cleanWorktree
          inputs:
            key: ${{ "bump-" + inputs.recipe.split("/")[1] + "-rebuild" }}
            branch: ${{ "bump-" + inputs.recipe.split("/")[1] + "-rebuild" }}
        dependsOn:
          - step: workspace
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: worktree
        description: A per-run worktree on the rebuild branch
        task:
          type: model_method
          modelType: "@swamp/git"
          modelName: ${{ "mere-rebuild-" + run.id }}
          methodName: ensure_worktree
          inputs:
            repoPath: ${{ data.latest(inputs.recipeBinding, "workspace").attributes.checkoutPath }}
            path: ${{ data.latest(inputs.recipeBinding, "workspace").attributes.worktreePath }}
            root: ${{ data.latest(inputs.recipeBinding, "workspace").attributes.worktreeRoot }}
            branch: ${{ "bump-" + inputs.recipe.split("/")[1] + "-rebuild" }}
            base: ${{ "refs/heads/" + data.latest(inputs.recipeBinding, "workspace").attributes.ref }}
        dependsOn:
          - step: clean
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: bump-release
        description: Increment only the recipe release number
        task:
          type: behavior
          behavior: ${{ inputs.recipeBinding }}
          methodName: bumpRelease
          inputs:
            recipe: ${{ inputs.recipe }}
            checkoutPath: ${{ data.latest(inputs.recipeBinding, "workspace").attributes.worktreePath }}
        dependsOn:
          - step: worktree
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: validate
        task:
          type: behavior
          behavior: ${{ inputs.recipeBinding }}
          methodName: validate
          inputs:
            recipe: ${{ inputs.recipe }}
            checkoutPath: ${{ data.latest(inputs.recipeBinding, "workspace").attributes.worktreePath }}
        dependsOn:
          - step: bump-release
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: build
        task:
          type: behavior
          behavior: ${{ inputs.recipeBinding }}
          methodName: build
          inputs:
            recipe: ${{ inputs.recipe }}
            checkoutPath: ${{ data.latest(inputs.recipeBinding, "workspace").attributes.worktreePath }}
            noCache: ${{ inputs.noCache }}
        dependsOn:
          - step: validate
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
    dependsOn:
      - job: prepare
        condition:
          type: succeeded
    weight: 0
  - name: deliver
    steps:
      - name: deliver-change
        task:
          type: workflow
          workflowIdOrName: "@jeremy/mere/deliver-change"
          inputs:
            worktreePath: ${{ data.latest(inputs.recipeBinding, "workspace").attributes.worktreePath }}
            branch: ${{ "bump-" + inputs.recipe.split("/")[1] + "-rebuild" }}
            baseSha: ${{ data.latest(inputs.recipeBinding, "change-" + inputs.recipe.split("/")[1]).attributes.baseCommit }}
            allowedPaths: ${{ [data.latest(inputs.recipeBinding, "change-" + inputs.recipe.split("/")[1]).attributes.path] }}
            commitMessage: >-
              ${{ inputs.recipe.split("/")[1] + ": rebuild release " + string(data.latest(inputs.recipeBinding, "change-" + inputs.recipe.split("/")[1]).attributes.release.after) }}
            title: >-
              ${{ inputs.recipe.split("/")[1] + ": rebuild release " + string(data.latest(inputs.recipeBinding, "change-" + inputs.recipe.split("/")[1]).attributes.release.after) }}
            body: ${{ inputs.reason }}
            prBinding: ${{ inputs.prBinding }}
            expectedAuthorEmail: ${{ inputs.expectedAuthorEmail }}
        dependsOn: []
        weight: 0
        allowFailure: false
    dependsOn:
      - job: build
        condition:
          type: succeeded
    weight: 0
version: 1
