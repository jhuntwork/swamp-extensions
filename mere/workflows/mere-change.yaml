id: 958c949d-1d59-4371-affe-e1901ecbc1d0
autoResume: true
name: "@jeremy/mere/mere-change"
description: >-
  Validate and deliver one scoped change to the Mere package-manager source
  tree. The workflow never edits source: it runs formatting, build, tests, and
  the built CLI smoke check, then delegates commit, push, and pull request
  creation to deliver-change. Merge remains manual.
tags: {}
inputs:
  properties:
    worktreePath:
      type: string
      minLength: 1
      description: Existing isolated Mere checkout containing the implementation.
    branch:
      type: string
      minLength: 1
      description: Branch containing the implementation.
    baseSha:
      type: string
      pattern: "^[0-9a-fA-F]{40,64}$"
      description: Full main commit from which the branch was created.
    allowedPaths:
      type: array
      minItems: 1
      items:
        type: string
      description: Exact source paths allowed in the commit.
    commitMessage:
      type: string
      minLength: 1
      description: Commit subject and pull-request title.
    title:
      type: string
      minLength: 1
      maxLength: 256
      description: Pull-request title.
    body:
      type: string
      default: ""
      maxLength: 65535
      description: Pull-request body.
    repository:
      type: string
      default: jhuntwork/mere
    prBinding:
      type: string
      default: mere-pr
      description: "@jeremy/github-pr behavior bound to the Mere repository."
    packetBinding:
      type: string
      default: mere-change-packets
      description: "@jeremy/change-packet behavior used for the delivery packet."
    expectedAuthorEmail:
      type: string
      default: ""
      description: When set, the commit author must use this email.
    subjectMaxLength:
      type: integer
      default: 69
    subjectPattern:
      type: string
      default: "^mere: [a-z0-9].*$"
    branchPattern:
      type: string
      default: "^(fix|feat|refactor|chore)-[a-z0-9._-]+$"
  required:
    - worktreePath
    - branch
    - baseSha
    - allowedPaths
    - commitMessage
    - title
jobs:
  - name: validate
    steps:
      - name: fmt-check
        description: Check source formatting before any delivery action.
        task:
          type: model_method
          modelType: "@jeremy/mere/tree"
          modelName: ${{ "mere-tree-" + run.id }}
          methodName: fmtCheck
          inputs:
            sourcePath: ${{ inputs.worktreePath }}
      - name: assert-fmt
        dependsOn:
          - step: fmt-check
            condition:
              type: succeeded
        task:
          type: assert
          expr: >-
            data.findBySpec("mere-tree-" + run.id, "fmt-result")[0].attributes.success == true &&
            data.findBySpec("mere-tree-" + run.id, "fmt-result")[0].attributes.exitCode == 0
          message: Mere source formatting check failed.
          severity: high
      - name: build
        dependsOn:
          - step: assert-fmt
            condition:
              type: succeeded
        task:
          type: model_method
          modelType: "@jeremy/mere/tree"
          modelName: ${{ "mere-tree-" + run.id }}
          methodName: build
          inputs:
            sourcePath: ${{ inputs.worktreePath }}
      - name: assert-build
        dependsOn:
          - step: build
            condition:
              type: succeeded
        task:
          type: assert
          expr: >-
            data.findBySpec("mere-tree-" + run.id, "build-result")[0].attributes.success == true &&
            data.findBySpec("mere-tree-" + run.id, "build-result")[0].attributes.exitCode == 0
          message: Mere source build failed.
          severity: high
      - name: test
        dependsOn:
          - step: assert-build
            condition:
              type: succeeded
        task:
          type: model_method
          modelType: "@jeremy/mere/tree"
          modelName: ${{ "mere-tree-" + run.id }}
          methodName: test
          inputs:
            sourcePath: ${{ inputs.worktreePath }}
      - name: assert-test
        dependsOn:
          - step: test
            condition:
              type: succeeded
        task:
          type: assert
          expr: >-
            data.findBySpec("mere-tree-" + run.id, "test-result")[0].attributes.success == true &&
            data.findBySpec("mere-tree-" + run.id, "test-result")[0].attributes.exitCode == 0
          message: Mere source tests failed.
          severity: high
      - name: smoke
        dependsOn:
          - step: assert-test
            condition:
              type: succeeded
        task:
          type: model_method
          modelType: "@jeremy/mere/tree"
          modelName: ${{ "mere-tree-" + run.id }}
          methodName: smoke
          inputs:
            sourcePath: ${{ inputs.worktreePath }}
      - name: assert-smoke
        dependsOn:
          - step: smoke
            condition:
              type: succeeded
        task:
          type: assert
          expr: >-
            data.findBySpec("mere-tree-" + run.id, "smoke-result")[0].attributes.success == true &&
            data.findBySpec("mere-tree-" + run.id, "smoke-result")[0].attributes.exitCode == 0 &&
            data.findBySpec("mere-tree-" + run.id, "smoke-result")[0].attributes.stderr == ""
          message: Built Mere CLI smoke check failed.
          severity: high
    dependsOn: []
    weight: 0
  - name: deliver
    steps:
      - name: deliver-change
        task:
          type: workflow
          workflowIdOrName: "@jeremy/mere/deliver-change"
          inputs:
            worktreePath: ${{ inputs.worktreePath }}
            branch: ${{ inputs.branch }}
            baseSha: ${{ inputs.baseSha }}
            allowedPaths: ${{ inputs.allowedPaths }}
            commitMessage: ${{ inputs.commitMessage }}
            title: ${{ inputs.title }}
            body: ${{ inputs.body }}
            repository: ${{ inputs.repository }}
            baseRef: main
            prBinding: ${{ inputs.prBinding }}
            packetBinding: ${{ inputs.packetBinding }}
            expectedAuthorEmail: ${{ inputs.expectedAuthorEmail }}
            subjectMaxLength: ${{ inputs.subjectMaxLength }}
            subjectPattern: ${{ inputs.subjectPattern }}
            branchPattern: ${{ inputs.branchPattern }}
        dependsOn: []
        weight: 0
        allowFailure: false
    dependsOn:
      - job: validate
        condition:
          type: succeeded
    weight: 0
version: 1
