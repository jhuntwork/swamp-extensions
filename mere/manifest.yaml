manifestVersion: 1
name: "@jeremy/mere"
version: "2026.11.13.4"
description: "Mere recipe behaviors: parsing, upstream version lookup, bumping, and rebuilding recipes, with a pinned toolchain."
license: MIT
repository: "https://github.com/jhuntwork/swamp-extensions"
paths:
  base: manifest
behaviors:
  - source.ts
  - toolchain.ts
  - profile.ts
  - recipe.ts
reports:
  - upstream_drift.ts
  - build_summary.ts
workflows:
  - workflows/recipe-scan.yaml
  - workflows/recipe-bump.yaml
  - workflows/recipe-rebuild.yaml
dependencies:
  - "@jeremy/mere-delivery"
  - "@jeremy/github-pr"
  - "@swamp/git"
additionalFiles:
  - README.md
  - LICENSE.txt
platforms:
  - linux-x86_64
  - linux-aarch64
labels:
  - mere
  - recipe
