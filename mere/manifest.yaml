manifestVersion: 1
name: "@jeremy/mere"
version: "2026.11.08.7"
description: "Mere domain behaviors: source artifacts, a pinned toolchain, source-tree validation, and reproducible rescue-image assembly."
license: MIT
repository: "https://github.com/jhuntwork/swamp-extensions"
paths:
  base: manifest
behaviors:
  - source.ts
  - toolchain.ts
  - profile.ts
  - recipe.ts
  - policy.ts
  - ci.ts
  - tree.ts
  - rescue_image.ts
reports:
  - upstream_drift.ts
  - build_summary.ts
  - work_cost.ts
  - model_cost.ts
workflows:
  - workflows/recipe-scan.yaml
  - workflows/recipe-bump.yaml
  - workflows/recipe-rebuild.yaml
  - workflows/deliver-change.yaml
  - workflows/mere-change.yaml
dependencies:
  - "@swamp/git"
  - "@swamp/agent-runner"
additionalFiles:
  - README.md
  - LICENSE.txt
platforms:
  - linux-x86_64
  - linux-aarch64
labels:
  - mere
  - recipe
  - rescue-image
